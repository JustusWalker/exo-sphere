name: Sync Eventbrite events

on:
  # Backstop. Webhook deliveries do get dropped, and a silently stale spotlight
  # is worse than an hour of lag.
  schedule:
    - cron: '0 * * * *'
  # Fired by the Cloudflare Worker when Eventbrite reports a change.
  repository_dispatch:
    types: [eventbrite-event]
  workflow_dispatch:

concurrency:
  group: sync-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify colour maths before trusting its output
        run: npm test

      # Fail here rather than 30 lines into Node output. A missing secret is a
      # setup problem, not a code problem, and the run should say so plainly.
      - name: Check the Eventbrite secret exists
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: |
          if [[ -z "$EVENTBRITE_TOKEN" ]]; then
            echo "::error::Repository secret EVENTBRITE_TOKEN is missing or empty."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "Eventbrite has no public event API, so the sync cannot run without it."
            exit 1
          fi

      - name: Fetch events and solve the poster palette
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: npm run sync

      - name: Commit if anything changed
        run: |
          # posters/ may not exist on a first run; naming a missing path makes
          # git status exit non-zero and kill the job under `set -e`.
          if [[ -z $(git status --porcelain -- events.json posters 2>/dev/null) ]]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "exosphere-bot"
          git config user.email "actions@github.com"
          git add events.json
          if [[ -d posters ]]; then git add posters; fi
          git commit -m "chore: sync events from Eventbrite"
          git push
