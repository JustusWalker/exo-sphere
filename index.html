<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exosphere</title>
    <meta name="description" content="Exosphere — house, techno, UKG, baile bass and jersey club in Toronto.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128+Text&family=Barlow:ital,wght@1,100&family=Inconsolata:wght@200;300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ================= HERO ================= -->
    <section id="page1">
        <!-- One evenly-spaced word. The letters used to be two spans — a tight
             "EXO" against a spaced "S P H E R E" — which made the two halves
             read as different words. -->
        <!-- The double space between O and S is deliberate and is preserved by
             white-space: pre on .logo — it keeps the EXO / SPHERE break that the
             mark has always had, without going back to two separate spans. -->
        <div class="logo" id="logo" role="img" aria-label="Exosphere">E X O  S P H E R E</div>
        <!-- Separators are marked aria-hidden so a screen reader reads the five
             phrases rather than a string of dashes. -->
        <p class="tagline">
            <span class="tagline__word">Ottawa-Based</span>
            <span class="tagline__sep" aria-hidden="true">-</span>
            <span class="tagline__word">Multi-Genre</span>
            <span class="tagline__sep" aria-hidden="true">-</span>
            <span class="tagline__word">Open Decks</span>
            <span class="tagline__sep" aria-hidden="true">-</span>
            <span class="tagline__word">Showcases</span>
            <span class="tagline__sep" aria-hidden="true">-</span>
            <span class="tagline__word">Local Talent</span>
        </p>

        <div class="date" id="hero-date">7 . 18 . 25</div>

        <a class="scroll-cue" href="#spotlight" aria-label="Scroll to the next event">
            <span class="scroll-cue__label" id="scroll-cue-label">Next Event</span>
            <span class="scroll-cue__arrow" aria-hidden="true"></span>
        </a>
    </section>

    <!-- ================= SPOTLIGHT =================
         The markup below is a real, working fallback. If events.json fails to
         load the page still renders a complete spotlight rather than an empty
         hero; app.js replaces these values when data arrives. -->
    <section id="spotlight" class="spotlight">
        <div class="spotlight__inner">
            <div class="spotlight__media">
                <img class="event-poster" id="spotlight-poster"
                     src="EXO11.png" alt="Exosphere event poster" width="1100" height="1100">
            </div>

            <div class="spotlight__body">
                <p class="spotlight__eyebrow" id="spotlight-eyebrow">Next Event</p>
                <h1 class="event-title" id="spotlight-title">EXOSPHERE 001:</h1>
                <p class="subtitle" id="spotlight-subtitle">Future Sounds</p>

                <dl class="spotlight__meta" id="spotlight-meta">
                    <div><dt>Date</dt><dd id="spotlight-date">07 . 18 . 25</dd></div>
                    <div id="spotlight-venue-field"><dt>Venue</dt><dd id="spotlight-venue">73 York</dd></div>
                    <div><dt>Doors</dt><dd id="spotlight-doors">10 PM · 19+</dd></div>
                </dl>

                <a class="ticket-button" id="primary-cta"
                   href="https://www.bouncelife.com/events/6853b3b0647ea64a95ee46be"
                   target="_blank" rel="noopener">
                    Get Tickets
                </a>
                <p class="ticket-note" id="ticket-note"></p>
            </div>
        </div>
    </section>

    <!-- ================= UPCOMING =================
         Future events other than the spotlight. Sits below the primary CTA on
         purpose: these are "there is more", not competition for the event you
         can buy into right now. Hidden until app.js finds something to put here. -->
    <section id="upcoming" class="archive archive--upcoming" hidden>
        <header class="archive__header">
            <h2 class="archive__title">Also Coming Up</h2>
            <div class="archive__controls">
                <button class="rail-btn" id="upcoming-prev" type="button" aria-label="Previous upcoming events">&#8592;</button>
                <button class="rail-btn" id="upcoming-next" type="button" aria-label="More upcoming events">&#8594;</button>
            </div>
        </header>
        <ul class="rail" id="upcoming-rail" tabindex="0" aria-label="Upcoming Exosphere events"></ul>
    </section>

    <!-- ================= ARCHIVE ================= -->
    <section id="archive" class="archive" hidden>
        <header class="archive__header">
            <h2 class="archive__title">Previously</h2>
            <div class="archive__controls">
                <button class="rail-btn" id="rail-prev" type="button" aria-label="Previous events">&#8592;</button>
                <button class="rail-btn" id="rail-next" type="button" aria-label="More events">&#8594;</button>
            </div>
        </header>
        <ul class="rail" id="archive-rail" tabindex="0" aria-label="Past Exosphere events"></ul>
    </section>

    <!-- ================= STICKY CTA ================= -->
    <div class="sticky-cta" id="sticky-cta" aria-hidden="true">
        <div class="sticky-cta__inner">
            <span class="sticky-cta__text" id="sticky-cta-text">EXOSPHERE 001</span>
            <a class="ticket-button ticket-button--compact" id="sticky-cta-link"
               href="https://www.bouncelife.com/events/6853b3b0647ea64a95ee46be"
               target="_blank" rel="noopener" tabindex="-1">
                Get Tickets
            </a>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
